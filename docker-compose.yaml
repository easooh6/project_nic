version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: project_nic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network


  app:
    build: .
    container_name: project_nic_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}

      SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB}

      SMT_HOST: ${SMTP_HOST}
      SMT_PORT: ${SMTP_PORT}
      SMT_HOST_USER: ${SMTP_USER}
      SMT_HOST_PASSWORD: ${SMTP_PASSWORD}

      PORT: 8000
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - .:/app

    depends_on:
      redis: 
          condition: service_healthy
      postgres:
          condition: service_healthy
    networks:
      - app_network


  redis:
    image: redis:7-alpine
    container_name: project_nic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


volumes:
  db_data:
  redis_data:

networks:
  app_network:
    driver: bridge